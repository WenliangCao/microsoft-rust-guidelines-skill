name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
      - name: Verify pinned snapshot
        run: python3 scripts/sync_guidelines.py --check
      - name: Test synchronization behavior
        run: python3 -m unittest discover -s tests -v
